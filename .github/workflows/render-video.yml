name: Render league video
on:
  push:
    branches: [video-preview]
    paths: ["video/**", ".github/workflows/render-video.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-noto-color-emoji
      - run: npm ci
      - run: npx remotion render MasroOpening out/masro7-opening.mp4 --codec=h264 --crf=20
      - uses: actions/upload-artifact@v4
        with:
          name: masro7-opening
          path: video/out/masro7-opening.mp4
      - name: Commit preview back to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f out/masro7-opening.mp4
          git commit -m "Render preview [skip ci]" || exit 0
          git push
