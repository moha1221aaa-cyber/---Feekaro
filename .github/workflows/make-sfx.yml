# يولّد المؤثرات الصوتية الحقيقية للبث مرة وحدة ويحفظها في audio/ كملفات دائمة
# يشتغل لما يتعدل هذا الملف أو functions/sfx-gen.js، أو يدوياً من تبويب Actions
name: make-sfx
on:
  push:
    branches: [main]
    paths: [".github/workflows/make-sfx.yml", "functions/sfx-gen.js"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate sounds
        env:
          SITE: https://masro7-league.pages.dev
        run: |
          mkdir -p audio
          LOG=audio/_log.txt
          echo "run $(date -u +%FT%TZ) sha=${GITHUB_SHA::7}" > $LOG
          # ننتظر Cloudflare ينشر الدالة الجديدة (لين 12 دقيقة)
          ok=""
          for i in $(seq 1 72); do
            p=$(curl -s -H "Referer: $SITE/" "$SITE/sfx-gen?id=ping" || true)
            if echo "$p" | grep -q '"ok":true'; then ok=1; echo "ping: $p" >> $LOG; break; fi
            sleep 10
          done
          [ -n "$ok" ] || echo "ping failed: $p" >> $LOG
          for id in braam riser impact whoosh slam heartbeat go cheer whistle fireworks bed_epic bed_tension crowd; do
            f=audio/$id.mp3
            if [ -s "$f" ]; then echo "$id: exists" >> $LOG; continue; fi
            code=$(curl -s -D /tmp/h -o /tmp/o -w '%{http_code}' -H "Referer: $SITE/" "$SITE/sfx-gen?id=$id" || echo 000)
            ct=$(grep -i '^content-type' /tmp/h | tr -d '\r' || true)
            cost=$(grep -i '^x-cost' /tmp/h | tr -d '\r' || true)
            if [ "$code" = "200" ] && echo "$ct" | grep -qi audio; then
              mv /tmp/o "$f"; echo "$id: ok $(stat -c%s $f) bytes $cost" >> $LOG
            else
              echo "$id: FAIL $code $(head -c 300 /tmp/o)" >> $LOG
            fi
          done
          cat $LOG
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "أصوات البث الحقيقية (ElevenLabs)" || exit 0
          git pull --rebase origin main
          git push
