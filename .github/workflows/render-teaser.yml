# ريندر تيزر الدوري (video/) بـ Remotion، والناتج MP4 في Artifacts
name: Render teaser

on:
  push:
    paths:
      - "video/**"
      - "!video/public/sfx/**"
      - ".github/workflows/render-teaser.yml"
  workflow_dispatch:
    inputs:
      force_voice:
        description: "أعد توليد كل سطور التعليق الصوتي"
        type: boolean
        default: false

concurrency:
  group: render-teaser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci

      # التعليق الصوتي بالفصحى: ElevenLabs ثم Azure. السطور الجاهزة ما تنعاد (توفير الرصيد)
      - name: Voiceover
        env:
          ELEVEN_KEY: ${{ secrets.ELEVEN_KEY }}
          ELEVEN_VOICE: ${{ vars.ELEVEN_VOICE }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
        run: |
          set +o pipefail  # لو فشل سطر، الريندر يكمل بالموجود
          npm run voiceover -- ${{ inputs.force_voice && '--force' || '' }} 2>&1 | tee voice.log
          { echo "### التعليق الصوتي"; echo '```'; cat voice.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save voiceover
        run: |
          if [ -n "$(git status --porcelain public/voiceover)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/voiceover
            git commit -m "تحديث التعليق الصوتي للتيزر (تلقائي)"
            git push origin HEAD:${{ github.ref_name }} || echo "ما قدر يرفع الصوت (الفرع تغيّر)، الريندر يكمل عادي"
          fi

      - name: Chrome headless shell
        run: npx remotion browser ensure

      - name: Render
        run: npx remotion render LeagueTeaser out/masro7-teaser.mp4 --codec=h264 --crf=18 --concurrency=4 --audio-bitrate=192k

      - uses: actions/upload-artifact@v4
        with:
          name: masro7-teaser
          path: video/out/masro7-teaser.mp4
          retention-days: 30

      # ريليز ثابت (teaser) عشان رابط التحميل ما يتغير مع كل ريندر
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view teaser >/dev/null 2>&1; then
            gh release upload teaser out/masro7-teaser.mp4 --clobber
          else
            gh release create teaser out/masro7-teaser.mp4 --target "$GITHUB_SHA" \
              --title "تيزر دوري بنو مسروح للنخبة" \
              --notes "فيديو عمودي 1080×1920، 30 ثانية. يتحدث تلقائياً مع كل تعديل في video/." \
              --prerelease
          fi
