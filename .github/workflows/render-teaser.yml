# ريندر تيزر الدوري (video/) بـ Remotion، والناتج MP4 في Artifacts
name: Render teaser

on:
  push:
    paths:
      - "video/**"
      - ".github/workflows/render-teaser.yml"
  workflow_dispatch:

concurrency:
  group: render-teaser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - run: npm ci

      - name: Chrome headless shell
        run: npx remotion browser ensure

      - name: Render
        run: npx remotion render LeagueTeaser out/masro7-teaser.mp4 --codec=h264 --crf=18 --concurrency=4

      - uses: actions/upload-artifact@v4
        with:
          name: masro7-teaser
          path: video/out/masro7-teaser.mp4
          retention-days: 30

      # ريليز ثابت (teaser) عشان رابط التحميل ما يتغير مع كل ريندر
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view teaser >/dev/null 2>&1; then
            gh release upload teaser out/masro7-teaser.mp4 --clobber
          else
            gh release create teaser out/masro7-teaser.mp4 --target "$GITHUB_SHA" \
              --title "تيزر دوري بنو مسروح للنخبة" \
              --notes "فيديو عمودي 1080×1920، 30 ثانية. يتحدث تلقائياً مع كل تعديل في video/." \
              --prerelease
          fi
